
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Showdown 3D</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#17243a}
h1{color:#f6c453;margin:5px}
#menu{padding:12px}
button{padding:12px 18px;margin:5px;border:0;border-radius:8px;background:#f6c453;font-weight:bold;cursor:pointer}
#game{width:100%;height:65vh;min-height:350px}
#info{padding:10px;font-size:18px}
#message{color:#f6c453;font-size:20px}
</style>
</head>
<body>
<header>
<h1>⚾ DIAMOND SHOWDOWN 3D</h1>
<div>THE ULTIMATE BASEBALL GAME</div>
</header>

<div id="menu">
<button onclick="startGame('Exhibition')">Exhibition</button>
<button onclick="startGame('Road to the Show')">Road to the Show</button>
<button onclick="startGame('Franchise')">Franchise</button>
<button onclick="startGame('Create a Player')">Create a Player</button>
</div>

<div id="info">
<div id="mode">Choose a game mode!</div>
<div id="score">Home 0 - 0 Away</div>
<div id="count">Balls: 0 | Strikes: 0 | Outs: 0</div>
<div id="message">Welcome to Diamond Showdown!</div>
<button onclick="swing()">SWING!</button>
<button onclick="pitch()">NEXT PITCH</button>
<button onclick="resetGame()">NEW GAME</button>
</div>

<div id="game"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60,1,0.1,1000);
camera.position.set(0,10,20);
camera.lookAt(0,2,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x477344,2));
const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,15,10);
scene.add(light);

function material(color){
 return new THREE.MeshStandardMaterial({color});
}

function box(w,h,d,color,x,y,z){
 const obj = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(color)
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function ball(radius,color,x,y,z){
 const obj = new THREE.Mesh(
  new THREE.SphereGeometry(radius,24,24),material(color)
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

// Stadium
box(100,1,100,0x287b35,0,-1,0);
box(100,2,3,0x777777,0,5,-30);
box(3,2,100,0x777777,-30,5,0);
box(3,2,100,0x777777,30,5,0);

// Infield
const diamond = new THREE.Mesh(
 new THREE.CircleGeometry(10,4),
 material(0xb87942)
);
diamond.rotation.x=-Math.PI/2;
diamond.rotation.z=Math.PI/4;
diamond.position.y=-0.45;
scene.add(diamond);

// Bases
box(1,0.2,1,0xffffff,0,-0.2,8);
box(1,0.2,1,0xffffff,8,-0.2,0);
box(1,0.2,1,0xffffff,0,-0.2,-8);
box(1,0.2,1,0xffffff,-8,-0.2,0);

// Pitcher's mound
ball(1.5,0xc49a6c,0,0,0);

// Batter
box(0.8,2,0.7,0x253b9a,-3,1,8);
ball(0.45,0xffcc99,-3,2.3,8);
box(0.15,2,0.15,0xffffff,-3.5,1,8);

// Pitcher
box(0.8,2,0.7,0xc62828,0,1,-1);
ball(0.45,0xffcc99,0,2.3,-1);

// Fielders
const fielderPositions=[
 [-10,1,-10],[10,1,-10],[-15,1,0],[15,1,0],[0,1,-18]
];
fielderPositions.forEach(p=>{
 box(0.8,2,0.7,0x253b9a,p[0],p[1],p[2]);
 ball(0.4,0xffcc99,p[0],2.3,p[2]);
});

// Ball
let baseball=ball(0.25,0xffffff,0,2,-1);
let ballMoving=false;
let ballVelocity=new THREE.Vector3();

let home=0,away=0,balls=0,strikes=0,outs=0;
let inning=1;
let currentMode="Exhibition";
let playerName="Rookie";
let playerHits=0,playerAtBats=0;
let franchiseWins=0,franchiseLosses=0;

function update(){
 document.getElementById("score").textContent=
 "Home "+home+" - "+away+" Away | Inning "+inning;
 document.getElementById("count").textContent=
 "Balls: "+balls+" | Strikes: "+strikes+" | Outs: "+outs;
}

function message(text){
 document.getElementById("message").textContent=text;
}

window.startGame=function(mode){
 currentMode=mode;
 document.getElementById("mode").textContent="Mode: "+mode;

 if(mode==="Create a Player" || mode==="Road to the Show"){
  let name=prompt("What is your player's name?","Rookie");
  if(name)playerName=name;
  message("Welcome, "+playerName+"!");
 }else if(mode==="Franchise"){
  message("Franchise season started! Win games to build your team.");
 }else{
  message("Exhibition game started!");
 }
 resetGame();
};

window.resetGame=function(){
 home=0;away=0;balls=0;strikes=0;outs=0;inning=1;
 update();
 baseball.position.set(0,2,-1);
 ballMoving=false;
 message("Get ready for the pitch!");
};

window.pitch=function(){
 if(ballMoving)return;
 baseball.position.set(0,2,-1);
 ballVelocity.set((Math.random()-.5)*0.08,-0.02,0.45);
 ballMoving=true;
 message("Pitch coming! Swing!");
};

window.swing=function(){
 if(!ballMoving){
  message("Wait for the pitcher!");
  return;
 }
 ballMoving=false;
 playerAtBats++;

 const timing=Math.abs(baseball.position.z-7);
 if(timing<2.5){
  playerHits++;
  const result=Math.random();
  if(result<0.2){
   home+=1;
   message("HOME RUN! "+playerName+" sends it out!");
  }else if(result<0.65){
   home+=1;
   message("BASE HIT! Run scores!");
  }else{
   message("Solid contact! Single!");
  }
  baseball.position.set(-10,5,-20);
 }else{
  strikes++;
  message("Swing and a miss!");
  baseball.position.set(0,2,-1);
 }
 if(strikes>=3){
  outs++;
  strikes=0;
  message("Strike three! Batter out!");
 }
 update();
 checkInning();
};

function checkInning(){
 if(outs>=3){
  outs=0;
  balls=0;
  strikes=0;
  inning++;
  message("Side retired! Inning "+inning);
  if(inning>3){
   if(home>away){
    franchiseWins++;
    message("YOU WIN! Final score: "+home+" - "+away);
   }else if(home<away){
    franchiseLosses++;
    message("GAME OVER! Final score: "+home+" - "+away);
   }else{
    message("TIE GAME! Final score: "+home+" - "+away);
   }
  }
  update();
 }
}

function animate(){
 requestAnimationFrame(animate);
 if(ballMoving){
  baseball.position.add(ballVelocity);
  if(baseball.position.z>9){
   ballMoving=false;
   balls++;
   if(balls>=4){
    message("WALK! Take first base!");
    balls=0;
   }else{
    message("Ball!");
   }
   baseball.position.set(0,2,-1);
   update();
  }
 }
 renderer.render(scene,camera);
}
animate();

function resize(){
 const area=document.getElementById("game");
 camera.aspect=area.clientWidth/area.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(area.clientWidth,area.clientHeight);
}
window.addEventListener("resize",resize);
resize();

</script>
</body>
</html>
